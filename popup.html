<!DOCTYPE html>
<html lang="ko">

<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./css/fontawesome.css">
<link rel="stylesheet" href="./css/all.css">
<link rel="stylesheet" href="./css/tailwind.css">
</head>

<body class="w-120 h-100 p-4 bg-white text-gray-900">
	<div class="wrap">
		<h1 class=" text-clifford">잇싸 옵션</h1>
		<div id="popdata"></div>
		<button type="button" class="btn" id="saveButton">Save</button>
	</div>
    <div class="flex items-center mt-4 gap-2">
        <button class="btn btn-lg btn-primary"><i class="fa-solid fa-camera"></i> 저장</button>
        <button class="btn btn-md btn-danger"><i class="fa-solid fa-xmark"></i> 경고</button>
        <button class="btn btn-sm btn-info"><i class="fa-solid fa-circle-info"></i> 정보</button>
        <button class="btn btn-xs btn-warning"> <i class="fa-solid fa-circle-question"></i> 도움</button>
    </div>
    <div class="flex items-center mt-4 gap-2">
        <input type="text" class="input" placeholder="입력 하세요" />
    </div>
    <div class="flex items-center mt-4 gap-2">
        <select class="select">
            <option value="0">선택하세요</option>
            <option value="1">01</option>
            <option value="2">02</option>
        </select>
        <select class="select" disabled>
            <option value="0">선택하세요</option>
            <option value="1">01</option>
            <option value="2">02</option>
        </select>
    </div>
	<script src="common.js"></script>
	<script src="popup.js"></script>
</body>

</html>
